{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Fusion | Login</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<div class="auth-page">

    <div class="auth-box">

        <div class="user-icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <h2>
            Login
        </h2>

        <p>
            Login to your Food Fusion account
        </p>


        {% if messages %}

            {% for message in messages %}

            <div class="message {{ message.tags }}">
                {{ message }}
            </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>


            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>


            <button type="submit">
                Login
            </button>

        </form>


        <p>
            Don't have an account?

            <a href="{% url 'signup' %}">
                Sign Up
            </a>

        </p>


        <a href="{% url 'home' %}">
            ← Back to Home
        </a>

    </div>

</div>


</body>

</html>
